<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noche Carmesí</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="sky"></div>
  <div class="nebula"></div>
  <div class="moon-wrap"><div class="moon-halo"></div><div class="moon"></div></div>
  <div class="stars" id="stars"></div>
  <div id="clouds"></div>
  <div class="mountains-far"></div>
  <div class="mountains-mid"></div>
  <div class="forest" id="forest"></div>
  <div class="ground"></div>

  <div class="lake" id="lake">
    <div class="lake-sky-ref"></div>
    <div class="lake-moon-ref"></div>
    <div class="lake-shimmer"></div>
  </div>

  <!-- Main SVG: village left, bridge, village right, couple -->
  <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg"
    style="position:absolute;bottom:0;left:0;width:100%;height:55%;pointer-events:none;"
    viewBox="0 0 1000 550" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#2a0040"/>
        <stop offset="100%" stop-color="#0d0018"/>
      </linearGradient>
      <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#1e0030"/>
        <stop offset="100%" stop-color="#0a0012"/>
      </linearGradient>
      <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#180028"/>
        <stop offset="100%" stop-color="#0a0015"/>
      </linearGradient>
      <linearGradient id="winGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#ffd060" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#ff8020" stop-opacity="0.6"/>
      </linearGradient>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
        <feComposite in="SourceGraphic" in2="b" operator="over"/>
      </filter>
      <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
        <feComposite in="SourceGraphic" in2="b" operator="over"/>
      </filter>
      <!-- animated window flicker -->
      <animate id="flick" attributeName="opacity" values="0.8;1;0.85;1;0.9" dur="3s" repeatCount="indefinite"/>
    </defs>

    </rect>
    <rect x="156" y="315" width="14" height="16" rx="2" fill="url(#winGlow)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.9;1;0.8;1" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="132" y="350" width="14" height="16" rx="2" fill="url(#winGlow)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.85;1;0.9" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="156" y="350" width="14" height="16" rx="2" fill="url(#winGlow)" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.8;1;0.9;0.7" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="141" y="395" width="18" height="50" rx="2" fill="#0e0020"/>

    <rect x="164" y="380" width="16" height="10" rx="2" fill="#220035"/>
    <ellipse cx="172" cy="378" rx="8" ry="5" fill="rgba(255,200,80,0.5)" filter="url(#softGlow)">

    <rect x="818" y="380" width="16" height="10" rx="2" fill="#220035"/>

      <animate attributeName="opacity" values="0.7;1;0.6;1;0.8" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- bridge road continuation -->

    <path d="M 640,490 Q 715,390 790,490 L 790,520 L 640,520 Z" fill="#060010" opacity="0.98"/>

    <!-- Piers -->
    <rect x="352" y="455" width="22" height="65" rx="3" fill="url(#stoneGrad)"/>
    <rect x="626" y="455" width="22" height="65" rx="3" fill="url(#stoneGrad)"/>
    <rect x="202" y="480" width="20" height="40" rx="2" fill="url(#stoneGrad)"/>
    <rect x="778" y="480" width="20" height="40" rx="2" fill="url(#stoneGrad)"/>

    <!-- Deck surface -->
    <rect x="178" y="430" width="644" height="16" rx="2" fill="url(#stoneGrad)" filter="url(#glow)"/>
    <!-- top edge highlight -->
    <rect x="178" y="428" width="644" height="4" rx="1" fill="#3a005a" opacity="0.8"/>
